name: Build APK
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - run: gradle assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk KPL_Career.apk
      - uses: actions/upload-artifact@v4
        with: { name: KPL-apk, path: KPL_Career.apk }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "v0.1-${{ github.run_number }}" KPL_Career.apk --title "KPL Career APK" --notes "Debug APK" --repo ${{ github.repository }}
